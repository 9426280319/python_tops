<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>
</head>
<body>
    <h2>HTML Table</h2>
    <table border="1" roompadding="20">
        <tr>
            <td colspan="2">room 1</td>
            <td>room 2</td>
            <td>room 3</td>
        </tr>
        <tr>
            <td rowspan="3">room 4</td>
            <td>room 5</td>
            <td>room 6</td>
            <td>room 7</td>
        </tr>
        <tr>
            <td colspan="3">room 8</td>
        </tr>
        <tr>
            <td>room 9</td>
            <td colspan="2">room 10</td>
        </tr>
    </table>
</body>
</html>
