<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo CRUD App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef5ff;
        }

        .todo-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .table th,
        .table td {
            vertical-align: middle;
        }

        .table-dark {
            background-color: #0d6efd !important;
        }

        h1 {
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1 class="fw-bold">Todo CRUD App</h1>
        </div>

        <div class="card todo-card p-4 mb-4">
            <h3 class="mb-3">Add Todo</h3>

            <form id="frm1">

                <div class="mb-3">
                    <label class="form-label">Todo Title</label>
                    <input type="text" class="form-control" id="taskname"
                        placeholder="Enter Todo">
                </div>

                <button type="submit" class="btn btn-primary" id="btn1">
                    Add Todo
                </button>

                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>

            </form>
        </div>

        <div class="card todo-card p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Todo List</h3>

                <input type="text"
                    class="form-control w-25"
                    placeholder="Search Todo..."
                    id="searchTodo">
            </div>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th width="180">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="result">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script>

        let todoArray = [];
        let editId = null;

        document.getElementById('frm1').addEventListener('submit', function (e) {

            e.preventDefault();

            let taskname = document.getElementById('taskname').value.trim();

            if (taskname == "") {
                alert("Please Enter Todo");
                return;
            }

            if (editId == null) {

                todoArray.push(taskname);

            } else {

                todoArray.splice(editId, 1, taskname);

                document.getElementById('btn1').textContent = "Add Todo";

                editId = null;
            }

            document.getElementById('taskname').value = "";

            searchTodo();
        });

        function printTodo(arr = todoArray) {

            let str = "";

            for (let i = 0; i < arr.length; i++) {

                let originalIndex = todoArray.indexOf(arr[i]);

                str += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${arr[i]}</td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm"
                            onclick="editTask(${originalIndex})">
                            Edit
                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="delTask(${originalIndex})">
                            Delete
                        </button>

                    </td>
                </tr>
                `;
            }

            document.getElementById('result').innerHTML = str;
        }

        function delTask(id) {

            if (confirm("Delete this todo?")) {

                todoArray.splice(id, 1);

                searchTodo();
            }
        }

        function editTask(id) {

            document.getElementById('taskname').value = todoArray[id];

            document.getElementById('btn1').textContent = "Update Todo";

            editId = id;
        }

        function searchTodo() {

            let search = document.getElementById('searchTodo').value.toLowerCase();

            if (search === "") {
                printTodo();
                return;
            }

            let filteredTodos = todoArray.filter(todo =>
                todo.toLowerCase().includes(search)
            );

            printTodo(filteredTodos);
        }

        document.getElementById("searchTodo")
            .addEventListener("keyup", searchTodo);

        printTodo();

    </script>

</body>

</html>
