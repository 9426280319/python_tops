     //==============Number==================

       console.log(number);
       console.log(typeof(number));

    //  =================string==============

     let name='dev'
     console.log(name);
     console.log(typeof(name));

    let bignum = 523456336536273872738374837483474387348374383n;
    console.log(bignum);
    console.log(typeof(bignum));

    // ==============boolean=================

    let flag = true;
    console.log(flag);
    console.log(typeof(flag));

    // ===============null===============

    let data = null;
    console.log(data);
    console.log(typeof(data));

    // ===============undefine=========
    
    let undefine;
    console.log(undefine);
    console.log(typeof(undefine));

    // ==============objects==========

    let user ={

        name:'dev',
        email:'dev@gmail.com'
    }
    
    console.log(user);
    console.log(typeof(user));

    // =============symbol==========

    let id = Symbol('id');
    console.log(id);
    console.log(typeof(id));
