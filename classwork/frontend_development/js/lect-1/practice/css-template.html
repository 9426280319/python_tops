<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masonry Grid Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Main Gallery Grid Container */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 100px;
            gap: 10px;
            width: 100%;
            max-width: 1000px;
        }

        /* Grid Items Styling */
        .gallery-item {
            position: relative;
            overflow: hidden;
            background-color: #ddd;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Specific Grid Spanning to Match the Image Layout */
        
        /* Row 1 & 2 Area */
        .item-camera { grid-column: span 2; grid-row: span 2; }
        .item-building { grid-column: span 1; grid-row: span 1; }
        .item-legs { grid-column: span 1; grid-row: span 1; }
        .item-smoke { grid-column: span 1; grid-row: span 1; }
        .item-boat-guy { grid-column: span 1; grid-row: span 1; }
        .item-lake-bridge { grid-column: span 1; grid-row: span 1; }

        /* Row 3 & 4 Area */
        .item-snow-mountain { grid-column: span 1; grid-row: span 1; }
        .item-pier { grid-column: span 1; grid-row: span 1; }
        .item-big-mountain { grid-column: span 2; grid-row: span 2; }
        .item-balcony { grid-column: span 1; grid-row: span 1; }
        .item-lotus { grid-column: span 1; grid-row: span 2; }
        .item-bridge-sit { grid-column: span 1; grid-row: span 1; }
        .item-sunset-hill { grid-column: span 1; grid-row: span 1; }

        /* Row 5 & 6 Area */
        .item-cable-car { grid-column: span 2; grid-row: span 2; }
        .item-foggy-field { grid-column: span 1; grid-row: span 1; }
        .item-factory { grid-column: span 1; grid-row: span 1; }
        .item-city-view { grid-column: span 1; grid-row: span 1; }
        .item-vegetables { grid-column: span 1; grid-row: span 1; }
        .item-street { grid-column: span 1; grid-row: span 1; }

        /* Row 7 & 8 Area (Bottom Section) */
        .item-girl-woods { 
            grid-column: span 3; 
            grid-row: span 3; 
        }
        .item-street-sun { grid-column: span 1; grid-row: span 1; }
        .item-skate { grid-column: span 1; grid-row: span 1; }
        .item-window { grid-column: span 1; grid-row: span 1; }

        /* Text Overlay for Gallery Example 1 */
        .overlay-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 150px;
            }
            .gallery-item {
                grid-column: span 1 !important;
                grid-row: span 1 !important;
            }
            .overlay-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

        <div class="gallery-item item-camera">
            <img src="https://picsum.photos/id/250/600/400" alt="Camera">

        <div class="gallery-item item-pier">

        <div class="gallery-item item-lotus">

        <div class="gallery-item item-cable-car">
