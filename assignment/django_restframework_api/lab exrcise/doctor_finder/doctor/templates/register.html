<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding-top: 60px; }
        .box { background: white; padding: 2rem; border-radius: 14px; width: 340px; border: 0.5px solid #e0e0e0; }
        h2 { margin-top: 0; color: #1a1a2e; }
        input { width: 100%; padding: 8px; margin: 6px 0 14px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #185FA5; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        a { display: block; text-align: center; margin-top: 12px; color: #185FA5; font-size: 13px; }
        .error { color: red; font-size: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Register</h2>

    {% if form.errors %}
        <div class="error">
            {% for field in form %}
                {% for error in field.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>
    <a href="/login/">Already have an account? Login</a>
</div>
</body>
</html>
