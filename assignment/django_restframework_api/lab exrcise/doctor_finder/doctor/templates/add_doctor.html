{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Doctor</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding-top: 60px; }
        .box { background: white; padding: 2rem; border-radius: 14px; width: 360px; border: 0.5px solid #e0e0e0; }
        h2 { margin-top: 0; color: #1a1a2e; }
        input { width: 100%; padding: 8px; margin: 6px 0 14px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #185FA5; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        label { font-size: 13px; color: #555; }
    </style>
</head>
<body>
<div class="box">
    <h2>Add Doctor</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Name</label>
        <input type="text" name="name" required>
        <label>Specialty</label>
        <input type="text" name="specialty" required>
        <label>Phone</label>
        <input type="text" name="phone" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Image</label>
        <input type="file" name="image" accept="image/*">
        <button type="submit">Save</button>
    </form>
</div>
</body>
</html>
