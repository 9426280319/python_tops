{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Doctor Finder</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        body { margin: 0; font-family: sans-serif; background: #f0f4f8; text-align: center; padding-top: 80px; }
        h1 { font-size: 32px; color: #1a1a2e; }
        p { color: #666; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 10px 28px; border-radius: 8px; text-decoration: none; font-size: 15px; margin: 6px; }
        .btn-primary { background: #185FA5; color: white; }
        .btn-outline { border: 1px solid #185FA5; color: #185FA5; }
    </style>
</head>
<body>
    <h1>Doctor Finder</h1>
    <p>Manage your doctors — simple and easy</p>
    {% if user.is_authenticated %}
        <a href="/doctors/" class="btn btn-primary">My Doctors</a>
        <a href="/logout/" class="btn btn-outline">Logout</a>
    {% else %}
        <a href="/register/" class="btn btn-primary">Register</a>
        <a href="/login/" class="btn btn-outline">Login</a>
    {% endif %}
</body>
</html>
