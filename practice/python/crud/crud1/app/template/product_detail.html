{% extends 'app/base.html' %}
{% block content %}
<div class="card shadow-sm" style="max-width:600px;">
  {% if product.image %}
    <img src="{{ product.image.url }}" class="card-img-top" style="height:300px; object-fit:cover;">
  {% endif %}
  <div class="card-body">
    <h3>{{ product.name }}</h3>
    <h5 class="text-success">₹{{ product.price }}</h5>
    <p>{{ product.description }}</p>
    <small class="text-muted">Added: {{ product.created_at|date:"d M Y" }}</small>
  </div>
  <div class="card-footer d-flex gap-2">
    <a href="{% url 'product_update' product.pk %}" class="btn btn-warning">Edit</a>
    <a href="{% url 'product_delete' product.pk %}" class="btn btn-danger">Delete</a>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Back</a>
  </div>
</div>
{% endblock %}
